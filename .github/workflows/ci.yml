name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor declared in pyproject; test the ends and one middle.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[toml]" pytest
      - name: Test
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # PINNED. An unpinned linter means CI can fail on a day the code did not
      # change, because a new ruff release added rules. Bump this deliberately.
      - run: pip install ruff==0.15.14
      - run: ruff check .

  offline:
    # The package promises that importing it touches no socket, no subprocess
    # and no $HOME. That is easy to break by accident, so it is a CI job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "."
      - name: Import must not touch the network
        run: |
          python - <<'PY'
          import socket
          def _boom(*a, **k):
              raise AssertionError("import opened a socket")
          socket.socket.connect = _boom
          import makervox_publish
          from makervox_publish.platforms.tiktok import client
          from makervox_publish.platforms.meta import facebook, instagram
          from makervox_publish.platforms.x import client as xc
          print("clean import:", makervox_publish.__version__)
          PY

  boundary:
    # This package is public; the deployment that produced it is not. This job
    # fails the build if anything operator-specific gets committed — a home
    # directory, an email address, a key-shaped string, a private key.
    #
    # The patterns here are deliberately GENERIC. A denylist naming the actual
    # private projects would publish those names in the very file meant to keep
    # them out; the specific list is kept outside this repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: No operator-specific data
        run: |
          set -o pipefail
          PAT='/Users/[a-z]|/home/[a-z]|[a-zA-Z0-9._%+-]+@(gmail|googlemail|icloud|outlook|yahoo|hotmail)\.|AIza[0-9A-Za-z_-]{10,}|sk-[A-Za-z0-9]{15,}|ghp_[A-Za-z0-9]{15,}|hf_[A-Za-z0-9]{15,}|BEGIN [A-Z ]*PRIVATE KEY'
          # every commit, not just HEAD: a public repo leaks anything it ever held
          fail=0
          for c in $(git rev-list --all); do
            if git grep -InE "$PAT" "$c" -- . > /tmp/hits 2>/dev/null; then
              echo "::error::operator-specific data in commit $c"
              head -20 /tmp/hits
              fail=1
            fi
          done
          [ "$fail" = "0" ] && echo "clean: no home dirs, emails, keys or private keys in any commit"
          exit $fail
