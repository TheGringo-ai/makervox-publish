name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor declared in pyproject; test the ends and one middle.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[toml]" pytest
      - name: Test
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # PINNED. An unpinned linter means CI can fail on a day the code did not
      # change, because a new ruff release added rules. Bump this deliberately.
      - run: pip install ruff==0.15.14
      - run: ruff check .

  offline:
    # The package promises that importing it touches no socket, no subprocess
    # and no $HOME. That is easy to break by accident, so it is a CI job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "."
      - name: Import must not touch the network
        run: |
          python - <<'PY'
          import socket
          def _boom(*a, **k):
              raise AssertionError("import opened a socket")
          socket.socket.connect = _boom
          import postvox
          from postvox.platforms.tiktok import client
          from postvox.platforms.meta import facebook, instagram
          from postvox.platforms.x import client as xc
          print("clean import:", postvox.__version__)
          PY
