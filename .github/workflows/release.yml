name: Release to PyPI

# Builds, verifies and publishes a release artifact to PyPI.
#
# Uses PyPI Trusted Publishing (OIDC). There is NO API token stored in this
# repository and none on the maintainer's machine — GitHub proves the workflow's
# identity to PyPI directly. A token that does not exist cannot leak, and there
# is nothing to rotate.
#
# One-time setup on pypi.org (maintainer only, cannot be automated):
#   PyPI -> Your projects -> Publishing -> Add a new pending publisher
#     PyPI project name : makervox_publish
#     Owner             : TheGringo-ai
#     Repository        : makervox_publish
#     Workflow          : release.yml
#     Environment       : pypi

# LIVE. Publishes on a GitHub Release, or manually via workflow_dispatch.
#
# Trusted Publishing (OIDC) is configured on pypi.org for project
# makervox-publish / owner TheGringo-ai / repo makervox-publish / workflow
# release.yml / environment pypi. There is no API token anywhere: GitHub proves
# the workflow's identity to PyPI directly, so nothing can leak and nothing
# needs rotating. Losing the PyPI password would not stop releases.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      # Metadata errors are rejected by PyPI at upload time, which is a bad
      # place to find out. Fail here instead.
      - run: python -m twine check dist/*
      # The tests already ran in CI against the source tree; this asserts the
      # BUILT artifact is importable, which is a different claim.
      - name: Installed wheel must import
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/python -c "
          import makervox_publish
          from makervox_publish.platforms.tiktok import client
          from makervox_publish.platforms.meta import facebook, instagram
          from makervox_publish.platforms.x import client as xc
          print('ok', makervox_publish.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing; nothing else is granted
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
